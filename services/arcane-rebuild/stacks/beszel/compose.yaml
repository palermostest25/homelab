services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_BESZEL_APP_URL:?Set BESZEL_BESZEL_APP_URL}
    ports:
    - 8090:8090
    volumes:
    - /opt/docker/appdata/beszel_data:/beszel_data
    - /opt/docker/appdata/beszel_socket:/beszel_socket
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./beszel_agent_data:/var/lib/beszel-agent
    environment:
      LISTEN: ${BESZEL_BESZEL_AGENT_LISTEN:?Set BESZEL_BESZEL_AGENT_LISTEN}
      KEY: ${BESZEL_BESZEL_AGENT_KEY:?Set BESZEL_BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_BESZEL_AGENT_TOKEN:?Set BESZEL_BESZEL_AGENT_TOKEN}
      HUB_URL: ${BESZEL_BESZEL_AGENT_HUB_URL:?Set BESZEL_BESZEL_AGENT_HUB_URL}
