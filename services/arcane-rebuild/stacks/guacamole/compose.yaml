services:
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: unless-stopped
    environment:
      POSTGRESQL_HOSTNAME: ${GUACAMOLE_GUACAMOLE_POSTGRESQL_HOSTNAME:?Set GUACAMOLE_GUACAMOLE_POSTGRESQL_HOSTNAME}
      POSTGRESQL_PORT: ${GUACAMOLE_GUACAMOLE_POSTGRESQL_PORT:?Set GUACAMOLE_GUACAMOLE_POSTGRESQL_PORT}
      POSTGRESQL_DATABASE: ${GUACAMOLE_GUACAMOLE_POSTGRESQL_DATABASE:?Set GUACAMOLE_GUACAMOLE_POSTGRESQL_DATABASE}
      POSTGRESQL_USER: ${GUACAMOLE_GUACAMOLE_POSTGRESQL_USER:?Set GUACAMOLE_GUACAMOLE_POSTGRESQL_USER}
      POSTGRESQL_PASSWORD: ${GUACAMOLE_GUACAMOLE_POSTGRESQL_PASSWORD:?Set GUACAMOLE_GUACAMOLE_POSTGRESQL_PASSWORD}
      GUACD_HOSTNAME: ${GUACAMOLE_GUACAMOLE_GUACD_HOSTNAME:?Set GUACAMOLE_GUACAMOLE_GUACD_HOSTNAME}
    volumes:
    - /opt/docker/appdata/guacamole/config:/etc/guacamole
    depends_on:
    - guacd
    - postgres
  postgres:
    image: postgres:15
    container_name: guac_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GUACAMOLE_POSTGRES_POSTGRES_DB:?Set GUACAMOLE_POSTGRES_POSTGRES_DB}
      POSTGRES_USER: ${GUACAMOLE_POSTGRES_POSTGRES_USER:?Set GUACAMOLE_POSTGRES_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GUACAMOLE_POSTGRES_POSTGRES_PASSWORD:?Set GUACAMOLE_POSTGRES_POSTGRES_PASSWORD}
    volumes:
    - /opt/docker/appdata/guacamole/db:/var/lib/postgresql/data
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
    - 1033:80
    volumes:
    - /opt/docker/appdata/guacamole/nginx.conf:/etc/nginx/conf.d/default.conf:ro
