services:
  dockwatch:
    image: ghcr.io/notifiarr/dockwatch:main
    container_name: dockwatch
    restart: unless-stopped
    ports:
    - 1200:80
    environment:
      PUID: ${DOCKWATCH_DOCKWATCH_PUID:?Set DOCKWATCH_DOCKWATCH_PUID}
      PGID: ${DOCKWATCH_DOCKWATCH_PGID:?Set DOCKWATCH_DOCKWATCH_PGID}
      TZ: ${DOCKWATCH_DOCKWATCH_TZ:?Set DOCKWATCH_DOCKWATCH_TZ}
    volumes:
    - /opt/docker/appdata/dockwatch:/config
    - /var/run/docker.sock:/var/run/docker.sock
