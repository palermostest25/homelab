services:
  odoo:
    image: odoo:17.0
    restart: always
    depends_on:
    - db
    ports:
    - 4040:8069
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${ODOO_DB_POSTGRES_DB:?Set ODOO_DB_POSTGRES_DB}
      POSTGRES_PASSWORD: ${ODOO_DB_POSTGRES_PASSWORD:?Set ODOO_DB_POSTGRES_PASSWORD}
      POSTGRES_USER: ${ODOO_DB_POSTGRES_USER:?Set ODOO_DB_POSTGRES_USER}
    restart: always
