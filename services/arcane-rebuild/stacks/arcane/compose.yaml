services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    restart: unless-stopped
    ports:
    - 80:3552
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /opt/docker/arcane/data:/app/data
    - /opt/docker/stacks:/opt/docker/stacks
    - /root/.docker/config.json:/root/.docker/config.json:ro
    environment:
      APP_URL: ${ARCANE_ARCANE_APP_URL:?Set ARCANE_ARCANE_APP_URL}
      PUID: ${ARCANE_ARCANE_PUID:?Set ARCANE_ARCANE_PUID}
      PGID: ${ARCANE_ARCANE_PGID:?Set ARCANE_ARCANE_PGID}
      ENCRYPTION_KEY: ${ARCANE_ARCANE_ENCRYPTION_KEY:?Set ARCANE_ARCANE_ENCRYPTION_KEY}
      JWT_SECRET: ${ARCANE_ARCANE_JWT_SECRET:?Set ARCANE_ARCANE_JWT_SECRET}
      PROJECTS_DIRECTORY: ${ARCANE_ARCANE_PROJECTS_DIRECTORY:?Set ARCANE_ARCANE_PROJECTS_DIRECTORY}
